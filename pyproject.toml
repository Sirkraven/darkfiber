[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "darkfiber"
version = "1.1.0"
description = "Physics-first coherence engine for Distributed Acoustic Sensing (DAS): the slope in the channel-time plane is the physics."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [
    { name = "Alejandro Yucare Rios", email = "Sirkraven@users.noreply.github.com" },
]
keywords = [
    "distributed-acoustic-sensing",
    "seismology",
    "earthquake-detection",
    "fiber-optic-sensing",
    "phased-array",
    "das",
    "multi-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
]

[project.optional-dependencies]
h5 = ["h5py>=3.10"]
tdms = ["npTDMS>=1.9"]
figs = ["matplotlib>=3.8"]
dashboard = ["streamlit>=1.30"]
ops = ["pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    # Pinned exactly, not >=: same local-green/CI-red drift as numpy/mypy
    # below, but for `ruff format` specifically -- its formatting opinions
    # change between minor versions (2026-08-01: 0.12.0 vs 0.16.1 disagreed
    # on two files that were already in the repo, unrelated to any code
    # change). An unpinned `ruff>=0.6` resolves to whatever's newest at
    # install time, so CI (fresh install) and a dev machine (whatever was
    # installed last) can silently disagree on `ruff format --check .` even
    # with zero code changes between runs. Bump deliberately, re-run
    # `ruff format .` locally against the new pin, and re-run the full CI
    # matrix in the same change.
    "ruff==0.16.1",
    # Pinned exactly, not >=: numpy>=2.3's bundled .pyi stubs use PEP 695
    # `type` statements, which mypy refuses to parse when python_version
    # (below) is <3.12 — even inside third-party stub files, not just our
    # own code (numpy/__init__.pyi:737: "Type statement is only supported
    # in Python 3.12 and greater"). mypy 2.3.0 is the current latest and
    # still has this limitation, so upgrading mypy doesn't fix it. This is
    # exactly the local-green/CI-red drift bug: an unpinned `numpy>=1.26`
    # resolves to whatever's newest at install time, and Python 3.10 caps
    # at 2.2.6 (numpy dropped 3.10 wheels after that) while 3.11/3.12 don't
    # — so the same floating constraint silently installs a broken-for-mypy
    # numpy on some interpreters and not others. Pinning both here makes
    # `pip install -e ".[dev]"` resolve identically on 3.10/3.11/3.12,
    # locally and in CI. Bump deliberately (and re-run the full matrix)
    # once mypy stops gating stub-only syntax on python_version.
    "numpy==2.2.6",
    "mypy==2.3.0",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/Sirkraven/darkfiber"
Repository = "https://github.com/Sirkraven/darkfiber"
Issues = "https://github.com/Sirkraven/darkfiber/issues"

[project.scripts]
darkfiber-validate = "darkfiber.run_validation:main_cli"
darkfiber-stanford = "darkfiber.run_on_stanford:main"
darkfiber-quakeflow = "darkfiber.run_on_quakeflow:main"
darkfiber-calibrate = "darkfiber.calibrate:main"
darkfiber-aperture = "darkfiber.characterize_aperture:main_cli"
darkfiber-interferometry = "darkfiber.interferometry:main"
darkfiber-convert-sgy = "darkfiber.convert_stanford_sgy:main"
darkfiber-snr-curve = "darkfiber.snr_curve:main"
darkfiber-replay = "darkfiber.replay:main"
darkfiber-dashboard = "darkfiber.dashboard:main"
darkfiber-pipeline = "darkfiber.pipeline_daemon:main"
darkfiber-series-robustness = "darkfiber.series_robustness:main"
darkfiber-paper-figures = "darkfiber.paper_figures:main"

[tool.hatch.build.targets.wheel]
packages = ["src/darkfiber"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # docstrings/explanations en español pueden superar 100 cols

[tool.ruff.lint.isort]
known-first-party = ["darkfiber"]

[tool.mypy]
python_version = "3.10"
packages = ["darkfiber"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
